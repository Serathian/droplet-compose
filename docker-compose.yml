  houseforce:
    image: ghcr.io/${GITHUB_OWNER}/houseforce:latest
    container_name: houseforce
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      NEXT_PUBLIC_STRAPI_URL: ${HOUSEFORCE_NEXT_PUBLIC_STRAPI_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.houseforce.rule=Host(`houseforce.jake-reddy.com`) || Host(`houseforce-blog.jake-reddy.com`)"
      - "traefik.http.routers.houseforce.entrypoints=websecure"
      - "traefik.http.routers.houseforce.tls.certresolver=le"
      - "traefik.http.services.houseforce.loadbalancer.server.port=3000"
    networks:
      - traefik-public

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/deploy/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_POLL_INTERVAL=0      # Disable polling, use push webhooks instead
      - WATCHTOWER_CLEANUP=true         # remove old images after update
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchtower.rule=Host(`deploy.jake-reddy.com`)"
      - "traefik.http.routers.watchtower.entrypoints=websecure"
      - "traefik.http.routers.watchtower.tls.certresolver=le"
      - "traefik.http.services.watchtower.loadbalancer.server.port=8080"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: false
  houseforce-internal:
    external: false
    internal: true
#  basecamp-internal:
#    external: false
#    internal: true

volumes:
  houseforce-db-data:
  houseforce-cms-uploads:
#  basecamp-db-data:
#  basecamp-uploads:
