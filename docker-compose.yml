services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
      - "--api.dashboard=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`dns.jake-reddy.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme.json:/acme.json"
    networks:
      - traefik-public

  lastlightexplorer:
    image: ghcr.io/${GITHUB_OWNER}/lastlightexplorer:latest
    container_name: lastlightexplorer
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lastlightexplorer.rule=Host(`explorer.jake-reddy.com`)"
      - "traefik.http.routers.lastlightexplorer.entrypoints=websecure"
      - "traefik.http.routers.lastlightexplorer.tls.certresolver=le"
      - "traefik.http.services.lastlightexplorer.loadbalancer.server.port=80"
    networks:
      - traefik-public

  # --- Headless CMS ---

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-payload}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cms-internal

  basecamp:
    image: ghcr.io/${GITHUB_OWNER}/basecamp-cms:latest
    container_name: basecamp
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://basecamp.jake-reddy.com}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACL: ${S3_ACL:-}
    volumes:
      - basecamp-media:/app/media
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.basecamp.rule=Host(`basecamp.jake-reddy.com`)"
      - "traefik.http.routers.basecamp.entrypoints=websecure"
      - "traefik.http.routers.basecamp.tls.certresolver=le"
      - "traefik.http.services.basecamp.loadbalancer.server.port=3000"
    networks:
      - traefik-public
      - cms-internal
    depends_on:
      postgres:
        condition: service_healthy

  # --- Websites ---

  jake-reddy:
    image: ghcr.io/${GITHUB_OWNER}/jake-reddy.com:latest
    container_name: jake-reddy
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jake-reddy.rule=Host(`jake-reddy.com`) || Host(`www.jake-reddy.com`)"
      - "traefik.http.routers.jake-reddy.entrypoints=websecure"
      - "traefik.http.routers.jake-reddy.tls.certresolver=le"
      - "traefik.http.services.jake-reddy.loadbalancer.server.port=80"
    networks:
      - traefik-public

  nerdintheforest:
    image: ghcr.io/${GITHUB_OWNER}/nerdintheforest.com:latest
    container_name: nerdintheforest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CMS_API_INTERNAL: ${CMS_API_INTERNAL:-http://basecamp:3000/api}
      NUXT_CMS_API_INTERNAL: ${CMS_API_INTERNAL:-http://basecamp:3000/api}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nerdintheforest.rule=Host(`nerdintheforest.com`) || Host(`www.nerdintheforest.com`)"
      - "traefik.http.routers.nerdintheforest.entrypoints=websecure"
      - "traefik.http.routers.nerdintheforest.tls.certresolver=le"
      - "traefik.http.services.nerdintheforest.loadbalancer.server.port=3000"
    networks:
      - traefik-public

  reddyontheroad:
    image: ghcr.io/${GITHUB_OWNER}/reddyontheroad.com:latest
    container_name: reddyontheroad
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CMS_API_INTERNAL: ${CMS_API_INTERNAL:-http://basecamp:3000/api}
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://basecamp.jake-reddy.com}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reddyontheroad.rule=Host(`reddyontheroad.com`) || Host(`www.reddyontheroad.com`)"
      - "traefik.http.routers.reddyontheroad.entrypoints=websecure"
      - "traefik.http.routers.reddyontheroad.tls.certresolver=le"
      - "traefik.http.services.reddyontheroad.loadbalancer.server.port=3000"
    networks:
      - traefik-public

  # --- Infrastructure ---

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_CLEANUP=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchtower.rule=Host(`watchtower.jake-reddy.com`)"
      - "traefik.http.routers.watchtower.entrypoints=websecure"
      - "traefik.http.routers.watchtower.tls.certresolver=le"
      - "traefik.http.services.watchtower.loadbalancer.server.port=8080"
    networks:
      - traefik-public

  backup:
    build: ./backup
    container_name: basecamp-backup
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-basecamp-backups}
      BACKUP_S3_STORAGE_CLASS: ${BACKUP_S3_STORAGE_CLASS:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./traefik/acme.json:/traefik/acme.json:ro
    networks:
      - cms-internal
      - traefik-public
    depends_on:
      postgres:
        condition: service_healthy

networks:
  traefik-public:
    name: traefik-public
    external: false
  cms-internal:
    external: false
    internal: true

volumes:
  postgres-data:
  basecamp-media:
