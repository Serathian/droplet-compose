services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
      - "--api.dashboard=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`dns.jake-reddy.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/acme.json:/acme.json"
    networks:
      - traefik-public

  jake-reddy:
    image: ghcr.io/${GITHUB_OWNER}/jake-reddy.com-backend:latest
    container_name: jake-reddy
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jake-reddy.rule=Host(`jake-reddy.com`)"
      - "traefik.http.routers.jake-reddy.entrypoints=websecure"
      - "traefik.http.routers.jake-reddy.tls.certresolver=le"
      - "traefik.http.services.jake-reddy.loadbalancer.server.port=3002"
    networks:
      - traefik-public

  lastlightexplorer:
    image: ghcr.io/${GITHUB_OWNER}/lastlightexplorer:latest
    container_name: lastlightexplorer
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lastlightexplorer.rule=Host(`explorer.jake-reddy.com`)"
      - "traefik.http.routers.lastlightexplorer.entrypoints=websecure"
      - "traefik.http.routers.lastlightexplorer.tls.certresolver=le"
      - "traefik.http.services.lastlightexplorer.loadbalancer.server.port=80"
    networks:
      - traefik-public

  30th-at-33:
    image: ghcr.io/${GITHUB_OWNER}/30th-at-33:latest
    container_name: 30th-at-33
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.30th-at-33.rule=Host(`30plus3.jake-reddy.com`)"
      - "traefik.http.routers.30th-at-33.entrypoints=websecure"
      - "traefik.http.routers.30th-at-33.tls.certresolver=le"
      - "traefik.http.services.30th-at-33.loadbalancer.server.port=80"
    networks:
      - traefik-public

  houseforce-cms:
    image: ghcr.io/${GITHUB_OWNER}/houseforce-cms:latest
    container_name: houseforce-cms
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${HOUSEFORCE_STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${HOUSEFORCE_STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${HOUSEFORCE_STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${HOUSEFORCE_STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${HOUSEFORCE_STRAPI_JWT_SECRET}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: houseforce-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${HOUSEFORCE_DB_NAME}
      DATABASE_USERNAME: ${HOUSEFORCE_DB_USER}
      DATABASE_PASSWORD: ${HOUSEFORCE_DB_PASSWORD}
      DATABASE_SSL: "false"
    volumes:
      - houseforce-cms-uploads:/opt/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.houseforce-cms.rule=Host(`houseforce-cms.jake-reddy.com`)"
      - "traefik.http.routers.houseforce-cms.entrypoints=websecure"
      - "traefik.http.routers.houseforce-cms.tls.certresolver=le"
      - "traefik.http.services.houseforce-cms.loadbalancer.server.port=1337"
    networks:
      - traefik-public
      - houseforce-internal
    depends_on:
      houseforce-db:
        condition: service_healthy

  houseforce-db:
    image: postgres:16-alpine
    container_name: houseforce-db
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c work_mem=8MB -c max_connections=40 -c maintenance_work_mem=32MB
    environment:
      POSTGRES_DB: ${HOUSEFORCE_DB_NAME}
      POSTGRES_USER: ${HOUSEFORCE_DB_USER}
      POSTGRES_PASSWORD: ${HOUSEFORCE_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOUSEFORCE_DB_USER} -d ${HOUSEFORCE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - houseforce-db-data:/var/lib/postgresql/data
    networks:
      - houseforce-internal

